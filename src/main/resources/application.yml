spring:
  application:
    name: devpath-platform-svc
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devpath}
    username: ${DB_USER:devpath}
    password: ${DB_PASSWORD:localdev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: devpath-platform
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  flyway:
    enabled: false   # 마이그레이션은 devpath-shared(중앙)에서 실행, 서비스는 validate만
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:dummy-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:dummy-secret}
            scope: read:user,user:email
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}
            scope: openid,profile,email
          release:
            provider: release
            client-id: ${MISSION_RELEASE_OAUTH_CLIENT_ID:disabled-release-client}
            client-secret: ${MISSION_RELEASE_OAUTH_CLIENT_SECRET:disabled-release-secret}
            authorization-grant-type: authorization_code
            redirect-uri: ${MISSION_RELEASE_OAUTH_REDIRECT_URI:https://api.leva.ai.kr/login/oauth2/code/release}
            scope: read:user,user:email
        provider:
          release:
            authorization-uri: ${MISSION_RELEASE_OAUTH_AUTHORIZATION_URI:https://oauth.staging.leva.ai.kr/v1/release/oauth/authorize}
            token-uri: ${MISSION_RELEASE_OAUTH_TOKEN_URI:http://localhost:8080/v1/release/oauth/token}
            user-info-uri: ${MISSION_RELEASE_OAUTH_USERINFO_URI:http://localhost:8080/v1/release/oauth/userinfo}
            user-name-attribute: id

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

devpath:
  auth:
    jwt-secret: ${JWT_SECRET:test-secret-please-change-min-32-bytes-long-0123456789}
    access-ttl: ${ACCESS_TTL:PT15M}
    refresh-ttl: ${REFRESH_TTL:P14D}
    auth-code-ttl: ${AUTH_CODE_TTL:PT60S}
    web-url: ${APP_WEB_URL:http://localhost:5173}
    admin-url: ${APP_ADMIN_URL:http://localhost:5174}
    mobile-redirect-uri: ${APP_MOBILE_REDIRECT_URI:devpath://callback}
    cookie-domain: ${COOKIE_DOMAIN:}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  beta:
    admin-emails: ${BETA_ADMIN_EMAILS:}
    notify-email: ${BETA_NOTIFY_EMAIL:}
    pending-redirect: ${BETA_PENDING_REDIRECT:/beta-pending}
  release:
    enabled: ${MISSION_RELEASE_CONTROL_ENABLED:false}
    control-token: ${MISSION_RELEASE_CONTROL_TOKEN:}
    fixture-revision: ${MISSION_RELEASE_FIXTURE_REVISION:}
    oauth-client-id: ${MISSION_RELEASE_OAUTH_CLIENT_ID:disabled-release-client}
    oauth-client-secret: ${MISSION_RELEASE_OAUTH_CLIENT_SECRET:disabled-release-secret}
    oauth-redirect-uri: ${MISSION_RELEASE_OAUTH_REDIRECT_URI:https://api.leva.ai.kr/login/oauth2/code/release}
    analytics-origin: ${MISSION_RELEASE_ANALYTICS_ORIGIN:https://analytics-spy.staging.leva.ai.kr}
    sandbox-origin: ${MISSION_RELEASE_SANDBOX_ORIGIN:}
    ai-origin: ${MISSION_RELEASE_AI_ORIGIN:}
    lcs-origin: ${MISSION_RELEASE_LCS_ORIGIN:}
    learning-origin: ${MISSION_RELEASE_LEARNING_ORIGIN:}
    internal-token: ${MISSION_RELEASE_INTERNAL_TOKEN:}
    run-ttl: ${MISSION_RELEASE_RUN_TTL:PT45M}
    oauth-code-ttl: ${MISSION_RELEASE_OAUTH_CODE_TTL:PT1M}
    oauth-access-ttl: ${MISSION_RELEASE_OAUTH_ACCESS_TTL:PT5M}
    capabilities: ${MISSION_RELEASE_CAPABILITIES:}
# devpath.storage.*(endpoint/bucket/access-key/secret-key/public-base-url)는 배포 환경변수
# DEVPATH_STORAGE_*로 주입한다(@ConfigurationProperties relaxed binding). application.yml에
# endpoint 기본값(빈 문자열)을 두면 @ConditionalOnProperty가 활성화돼 S3Client가 빈 endpoint로
# 생성되며 전체 컨텍스트가 깨지므로, 여기서는 정의하지 않는다. endpoint 미설정 시 스토리지 비활성.
